      <section class="calculator panel" aria-labelledby="pageTitle">
        <span class="eyebrow">Converter</span>
        <h1 id="pageTitle">Unit Converter</h1>
        <p class="muted">Convert length, weight, and temperature units with a clean interface.</p>

        <div class="form-grid">
          <div class="field">
            <label for="converterType">Unit type</label>
            <select class="select" id="converterType" onchange="updateUnitOptions()">
              <option value="length">Length</option>
              <option value="temperature">Temperature</option>
              <option value="weight">Weight</option>
            </select>
          </div>
          <div class="field">
            <label for="unitValue">Value</label>
            <input class="input" type="number" id="unitValue" placeholder="Enter value" step="any">
          </div>
          <div class="two-column">
            <div class="field">
              <label for="fromUnit">From</label>
              <select class="select" id="fromUnit"></select>
            </div>
            <div class="field">
              <label for="toUnit">To</label>
              <select class="select" id="toUnit"></select>
            </div>
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="button" onclick="convertUnit()">Convert</button>
            <button class="btn btn-secondary" type="button" onclick="clearUnit()">Clear</button>
            <button class="btn btn-secondary" type="button" onclick="copyResult('unitResult')">Copy result</button>
          </div>
        </div>

        <div class="result-box" id="unitResult" aria-live="polite">Choose units and enter a value to convert.</div>
      </section>
    </div>
  </main>

  <script src="assets/js/app.js?v=4"></script>
  <script>
    const unitOptions = {
      length: {
        km: ["Kilometres", 1000],
        m: ["Metres", 1],
        cm: ["Centimetres", 0.01],
        mm: ["Millimetres", 0.001],
        mi: ["Miles", 1609.344],
        ft: ["Feet", 0.3048]
      },
      weight: {
        kg: ["Kilograms", 1000],
        g: ["Grams", 1],
        mg: ["Milligrams", 0.001],
        lb: ["Pounds", 453.59237],
        oz: ["Ounces", 28.3495]
      },
      temperature: {
        C: ["Celsius"],
        F: ["Fahrenheit"],
        K: ["Kelvin"]
      }
    };

    function updateUnitOptions() {
      const type = document.getElementById("converterType").value;
      const options = Object.entries(unitOptions[type]).map(([value, data]) => `<option value="${value}">${data[0]}</option>`).join("");
      document.getElementById("fromUnit").innerHTML = options;
      document.getElementById("toUnit").innerHTML = options;
      const keys = Object.keys(unitOptions[type]);
      document.getElementById("toUnit").value = keys[1] || keys[0];
      setResult("unitResult", "Choose units and enter a value to convert.", "");
    }

    function convertTemperature(value, from, to) {
      const celsius = from === "F" ? (value - 32) * 5 / 9 : from === "K" ? value - 273.15 : value;
      if (to === "C") return celsius;
      if (to === "F") return (celsius * 9 / 5) + 32;
      return celsius + 273.15;
    }

    function convertUnit() {
      const type = document.getElementById("converterType").value;
      const value = getNumber("unitValue");
      const from = document.getElementById("fromUnit").value;
      const to = document.getElementById("toUnit").value;

      if (!Number.isFinite(value)) {
        setResult("unitResult", "Please enter a valid number.", "error");
        return;
      }

      let result;
      if (type === "temperature") {
        result = convertTemperature(value, from, to);
        if (to === "K" && result < 0) {
          setResult("unitResult", "Temperature cannot be below absolute zero.", "error");
          return;
        }
      } else {
        const baseValue = value * unitOptions[type][from][1];
        result = baseValue / unitOptions[type][to][1];
      }

      setResult("unitResult", `${formatNumber(value, 6)} ${from} = ${formatNumber(result, 6)} ${to}`);
    }

    function clearUnit() {
      document.getElementById("unitValue").value = "";
      setResult("unitResult", "Choose units and enter a value to convert.", "");
    }

    updateUnitOptions();
  </script>
