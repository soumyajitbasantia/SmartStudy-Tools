<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calculate loan EMI, total payment, and total interest with the free SmartStudy loan calculator.">
  <title>Loan EMI Calculator - SmartStudy Tools</title>
  <link rel="icon" href="assets/images/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/styles.css?v=4">
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="logo" href="index.html"><span class="logo-mark" aria-hidden="true">S</span><span>SmartStudy Tools</span></a>
      <div class="nav-links"><a href="index.html">Home</a><a href="tool.html">Tools</a></div>
    </nav>
  </header>

  <main class="tool-page">
    <div class="container">
      <a class="btn btn-secondary" href="tool.html"><span class="icon-only" aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></span> Back to tools</a>
      <section class="calculator panel" aria-labelledby="pageTitle">
        <span class="eyebrow">Finance</span>
        <h1 id="pageTitle">Loan EMI Calculator</h1>
        <p class="muted">Estimate your monthly EMI, total payment, and interest amount.</p>

        <div class="form-grid">
          <div class="field">
            <label for="loanAmount">Loan amount</label>
            <input class="input" type="number" id="loanAmount" placeholder="Example: 500000" min="0" step="any">
          </div>
          <div class="two-column">
            <div class="field">
              <label for="interestRate">Annual interest rate (%)</label>
              <input class="input" type="number" id="interestRate" placeholder="Example: 8.5" min="0" step="any">
            </div>
            <div class="field">
              <label for="months">Duration in months</label>
              <input class="input" type="number" id="months" placeholder="Example: 60" min="1" step="1">
            </div>
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="button" onclick="calculateEMI()">Calculate EMI</button>
            <button class="btn btn-secondary" type="button" onclick="clearLoan()">Clear</button>
            <button class="btn btn-secondary" type="button" onclick="copyResult('loanResult')">Copy result</button>
          </div>
        </div>

        <div class="result-box" id="loanResult" aria-live="polite">Enter loan details to see the result.</div>
      </section>
    </div>
  </main>

  <script src="assets/js/app.js?v=4"></script>
  <script>
    function calculateEMI() {
      const principal = getNumber("loanAmount");
      const annualRate = getNumber("interestRate");
      const months = Math.trunc(getNumber("months"));

      if (!isPositiveNumber(principal) || !Number.isFinite(annualRate) || annualRate < 0 || !Number.isInteger(months) || months <= 0) {
        setResult("loanResult", "Please enter a positive loan amount, a valid interest rate, and a duration above 0 months.", "error");
        return;
      }

      const monthlyRate = annualRate / 12 / 100;
      const emi = monthlyRate === 0
        ? principal / months
        : (principal * monthlyRate * Math.pow(1 + monthlyRate, months)) / (Math.pow(1 + monthlyRate, months) - 1);
      const totalPayment = emi * months;
      const totalInterest = totalPayment - principal;

      setResult("loanResult", `
        <div class="result-list">
          <div>Monthly EMI: ${formatCurrency(emi)}</div>
          <div>Total payment: ${formatCurrency(totalPayment)}</div>
          <div>Total interest: ${formatCurrency(totalInterest)}</div>
        </div>
      `);
    }

    function clearLoan() {
      ["loanAmount", "interestRate", "months"].forEach((id) => document.getElementById(id).value = "");
      setResult("loanResult", "Enter loan details to see the result.", "");
    }
  </script>
</body>
</html>
