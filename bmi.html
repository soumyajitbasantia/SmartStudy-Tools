    <section class="calculator panel" aria-labelledby="pageTitle"><span class="eyebrow">Health</span><h1 id="pageTitle">BMI Calculator</h1><p class="muted">Calculate body mass index from weight and height.</p>
      <div class="form-grid"><div class="two-column"><div class="field"><label for="weight">Weight in kg</label><input class="input" id="weight" type="number" min="1" step="any" placeholder="Example: 60"></div><div class="field"><label for="height">Height in cm</label><input class="input" id="height" type="number" min="1" step="any" placeholder="Example: 170"></div></div><div class="actions"><button class="btn btn-primary" onclick="calculateBMI()">Calculate BMI</button><button class="btn btn-secondary" onclick="copyResult('bmiResult')">Copy result</button><button class="btn btn-secondary" onclick="clearBMI()">Clear</button></div></div>
      <div class="result-box" id="bmiResult" aria-live="polite">Enter height and weight to calculate BMI.</div>
    </section></div></main>
  <script src="assets/js/app.js?v=4"></script>
  <script>
    function calculateBMI(){const w=getNumber('weight'), h=getNumber('height'); if(!isPositiveNumber(w)||!isPositiveNumber(h)){setResult('bmiResult','Please enter valid positive weight and height.','error');return;} const bmi=w/Math.pow(h/100,2); let cat=bmi<18.5?'Underweight':bmi<25?'Normal weight':bmi<30?'Overweight':'Obesity range'; setResult('bmiResult',`BMI: ${formatNumber(bmi,1)}<br>Category: ${cat}`)}
    function clearBMI(){weight.value='';height.value='';setResult('bmiResult','Enter height and weight to calculate BMI.','')}
  </script>
