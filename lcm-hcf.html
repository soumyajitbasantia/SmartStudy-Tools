<main class="tool-page"><div class="container"><a class="btn btn-secondary" href="tool.html"><span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></span> Back to tools</a><section class="calculator panel" aria-labelledby="pageTitle"><span class="eyebrow">Calculator</span><h1 id="pageTitle">LCM & HCF Calculator</h1><p class="muted">Enter whole numbers separated by commas. Example: 12, 18, 24</p><div class="field"><label for="numbers">Numbers</label><input class="input" id="numbers" placeholder="12, 18, 24"></div><div class="actions"><button class="btn btn-primary" onclick="calculateLH()">Calculate</button><button class="btn btn-secondary" onclick="copyResult('lhResult')">Copy result</button><button class="btn btn-secondary" onclick="clearLH()">Clear</button></div><div class="result-box" id="lhResult" aria-live="polite">Enter numbers to find LCM and HCF.</div></section></div></main>
<script src="assets/js/app.js?v=4"></script><script>
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b)}
function parseNums(){return numbers.value.split(/[ ,]+/).filter(Boolean).map(Number)}
function calculateLH(){const arr=parseNums(); if(arr.length<2||arr.some(n=>!Number.isInteger(n)||n<=0)){setResult('lhResult','Please enter at least two positive whole numbers.','error');return;} const h=arr.reduce(gcd), l=arr.reduce(lcm); setResult('lhResult',`Numbers: ${arr.join(', ')}<br>HCF: ${formatNumber(h,0)}<br>LCM: ${formatNumber(l,0)}`)}
function clearLH(){numbers.value='';setResult('lhResult','Enter numbers to find LCM and HCF.','')}
</script></body></html>
