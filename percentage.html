<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calculate percentages, percentage change, discounts, and original values with SmartStudy Tools.">
  <title>Percentage Calculator - SmartStudy Tools</title>
  <link rel="icon" href="assets/images/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/styles.css?v=4">
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="logo" href="index.html"><span class="logo-mark" aria-hidden="true">S</span><span>SmartStudy Tools</span></a>
      <div class="nav-links"><a href="index.html">Home</a><a href="tool.html">Tools</a></div>
    </nav>
  </header>

  <main class="tool-page">
    <div class="container">
      <a class="btn btn-secondary" href="tool.html"><span class="icon-only" aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></span> Back to tools</a>
      <section class="calculator panel" aria-labelledby="pageTitle">
        <span class="eyebrow">Calculator</span>
        <h1 id="pageTitle">Percentage Calculator</h1>
        <p class="muted">Choose a calculation type, enter values, and get an instant result.</p>

        <div class="form-grid">
          <div class="field">
            <label for="mode">Calculation type</label>
            <select class="select" id="mode" onchange="updateLabels()">
              <option value="of">What is X% of Y?</option>
              <option value="what">X is what % of Y?</option>
              <option value="change">Percentage increase/decrease</option>
              <option value="original">X is Y% of what number?</option>
              <option value="discount">Discount calculator</option>
            </select>
          </div>
          <div class="two-column">
            <div class="field">
              <label id="labelA" for="valueA">Percentage</label>
              <input class="input" type="number" id="valueA" step="any" placeholder="Example: 20">
            </div>
            <div class="field">
              <label id="labelB" for="valueB">Total</label>
              <input class="input" type="number" id="valueB" step="any" placeholder="Example: 500">
            </div>
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="button" onclick="calculatePercentage()">Calculate</button>
            <button class="btn btn-secondary" type="button" onclick="clearPercentage()">Clear</button>
            <button class="btn btn-secondary" type="button" onclick="copyResult('percentResult')">Copy result</button>
          </div>
        </div>

        <div class="result-box" id="percentResult" aria-live="polite">Select a type and enter values to see the result.</div>
      </section>
    </div>
  </main>

  <script src="assets/js/app.js?v=4"></script>
  <script>
    const labels = {
      of: ["Percentage (X)", "Total (Y)", "Example: 20", "Example: 500"],
      what: ["Part (X)", "Whole (Y)", "Example: 50", "Example: 200"],
      change: ["Old value", "New value", "Example: 100", "Example: 125"],
      original: ["Part (X)", "Percentage (Y)", "Example: 40", "Example: 20"],
      discount: ["Original price", "Discount (%)", "Example: 999", "Example: 15"]
    };

    function updateLabels() {
      const mode = document.getElementById("mode").value;
      const [labelA, labelB, placeholderA, placeholderB] = labels[mode];
      document.getElementById("labelA").textContent = labelA;
      document.getElementById("labelB").textContent = labelB;
      document.getElementById("valueA").placeholder = placeholderA;
      document.getElementById("valueB").placeholder = placeholderB;
    }

    function calculatePercentage() {
      const mode = document.getElementById("mode").value;
      const a = getNumber("valueA");
      const b = getNumber("valueB");

      if (!Number.isFinite(a) || !Number.isFinite(b)) {
        setResult("percentResult", "Please enter both values correctly.", "error");
        return;
      }

      let message = "";
      if (mode === "of") {
        message = `${a}% of ${formatNumber(b)} is ${formatNumber((a / 100) * b)}.`;
      } else if (mode === "what") {
        if (b === 0) return setResult("percentResult", "Whole value cannot be zero.", "error");
        message = `${formatNumber(a)} is ${formatNumber((a / b) * 100)}% of ${formatNumber(b)}.`;
      } else if (mode === "change") {
        if (a === 0) return setResult("percentResult", "Old value cannot be zero.", "error");
        const change = ((b - a) / a) * 100;
        message = `${change >= 0 ? "Increase" : "Decrease"}: ${formatNumber(Math.abs(change))}%.`;
      } else if (mode === "original") {
        if (b === 0) return setResult("percentResult", "Percentage cannot be zero.", "error");
        message = `${formatNumber(a)} is ${b}% of ${formatNumber(a / (b / 100))}.`;
      } else if (mode === "discount") {
        if (a < 0 || b < 0) return setResult("percentResult", "Price and discount should not be negative.", "error");
        const discountAmount = (b / 100) * a;
        const finalPrice = a - discountAmount;
        message = `Final price: ${formatCurrency(finalPrice)}. You save ${formatCurrency(discountAmount)}.`;
      }

      setResult("percentResult", message);
    }

    function clearPercentage() {
      document.getElementById("valueA").value = "";
      document.getElementById("valueB").value = "";
      setResult("percentResult", "Select a type and enter values to see the result.", "");
    }
  </script>
</body>
</html>
