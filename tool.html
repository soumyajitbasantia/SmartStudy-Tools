<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse free student tools including calculators, converters, finance helpers, and study utilities.">
  <meta name="theme-color" content="#2563eb">
  <title>Tools Dashboard - SmartStudy Tools</title>
  <link rel="icon" href="assets/images/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/styles.css?v=4">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="logo" href="index.html">
        <span class="logo-mark" aria-hidden="true">S</span>
        <span>SmartStudy Tools</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="tool.html" aria-current="page">Tools</a>
      </div>
    </nav>
  </header>

  <main id="main" class="tool-page">
    <div class="container">
      <span class="eyebrow">Student tool dashboard</span>
      <h1 class="page-title">Choose your tool</h1>
      <p class="page-subtitle">Search and open calculators, converters, and practice utilities made for quick student use.</p>

      <div class="search-panel" role="search">
        <label class="field">
          <span class="hidden">Search tools</span>
          <input class="input" id="toolSearch" type="search" placeholder="Search tools, e.g. percentage, loan, converter..." autocomplete="off">
        </label>
        <label class="field">
          <span class="hidden">Filter by category</span>
          <select class="select" id="categoryFilter">
            <option value="all">All categories</option>
          </select>
        </label>
        <a class="btn btn-secondary" href="index.html">Back home</a>
      </div>

      <div id="toolsGrid" class="tools-grid" aria-label="All SmartStudy tools"></div>
      <p id="emptyState" class="result-box hidden" role="status">No tools found. Try another search term.</p>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>© 2026 SmartStudy Tools</span>
      <span>Simple, free, mobile-friendly.</span>
    </div>
  </footer>

  <script src="assets/js/app.js?v=4"></script>
  <script>
    renderToolCards("toolsGrid");
    setupCategoryFilter("categoryFilter");
    setupToolFilters("toolSearch", "categoryFilter", "toolsGrid", "emptyState");
  </script>
</body>
</html>
