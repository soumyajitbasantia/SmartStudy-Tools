    <div class="container">
      <a class="btn btn-secondary" href="tool.html"><span class="icon-only" aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></span> Back to tools</a>
      <section class="calculator panel" aria-labelledby="pageTitle">
        <span class="eyebrow">Calculator</span>
        <h1 id="pageTitle">Math Calculator</h1>
        <p class="muted">Calculate basic arithmetic operations with clear validation.</p>

        <div class="form-grid">
          <div class="field">
            <label for="num1">First number</label>
            <input class="input" type="number" id="num1" placeholder="Example: 25" step="any">
          </div>

          <div class="field">
            <label for="operator">Operation</label>
            <select class="select" id="operator">
              <option value="+">Addition (+)</option>
              <option value="-">Subtraction (−)</option>
              <option value="*">Multiplication (×)</option>
              <option value="/">Division (÷)</option>
            </select>
          </div>

          <div class="field">
            <label for="num2">Second number</label>
            <input class="input" type="number" id="num2" placeholder="Example: 5" step="any">
          </div>

          <div class="actions">
            <button class="btn btn-primary" type="button" onclick="calculate()">Calculate</button>
            <button class="btn btn-secondary" type="button" onclick="clearCalculator()">Clear</button>
            <button class="btn btn-secondary" type="button" onclick="copyResult('result')">Copy result</button>
          </div>
        </div>

        <div class="result-box" id="result" aria-live="polite">Your result will appear here.</div>
      </section>
    </div>
  </main>

  <script src="assets/js/app.js?v=4"></script>
  <script>
    function calculate() {
      const num1 = getNumber("num1");
      const num2 = getNumber("num2");
      const operator = document.getElementById("operator").value;
      let result;

      if (!Number.isFinite(num1) || !Number.isFinite(num2)) {
        setResult("result", "Please enter both numbers correctly.", "error");
        return;
      }

      switch (operator) {
        case "+": result = num1 + num2; break;
        case "-": result = num1 - num2; break;
        case "*": result = num1 * num2; break;
        case "/":
          if (num2 === 0) {
            setResult("result", "Division by zero is not allowed.", "error");
            return;
          }
          result = num1 / num2;
          break;
        default:
          setResult("result", "Please choose a valid operation.", "error");
          return;
      }

      setResult("result", `Result: ${formatNumber(result, 6)}`);
    }

    function clearCalculator() {
      document.getElementById("num1").value = "";
      document.getElementById("num2").value = "";
      setResult("result", "Your result will appear here.", "");
    }
  </script>
