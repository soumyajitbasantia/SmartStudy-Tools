      <section class="calculator panel" aria-labelledby="pageTitle">
        <span class="eyebrow">Student Life</span>
        <h1 id="pageTitle">Age Calculator</h1>
        <p class="muted">Calculate age accurately and see how many days are left until the next birthday.</p>

        <div class="form-grid">
          <div class="field">
            <label for="dob">Date of birth</label>
            <input class="input" type="date" id="dob">
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="button" onclick="calculateAge()">Calculate age</button>
            <button class="btn btn-secondary" type="button" onclick="clearAge()">Clear</button>
            <button class="btn btn-secondary" type="button" onclick="copyResult('result')">Copy result</button>
          </div>
        </div>

        <div class="result-box" id="result" aria-live="polite">Select your date of birth to see your age.</div>
      </section>
    </div>

  <script src="assets/js/app.js?v=4"></script>
  <script>
    document.getElementById("dob").max = new Date().toISOString().split("T")[0];

    function calculateAge() {
      const dobValue = document.getElementById("dob").value;
      if (!dobValue) {
        setResult("result", "Please select your date of birth.", "error");
        return;
      }

      const dob = new Date(`${dobValue}T00:00:00`);
      const today = new Date();
      if (dob > today) {
        setResult("result", "Date of birth cannot be in the future.", "error");
        return;
      }

      let years = today.getFullYear() - dob.getFullYear();
      let months = today.getMonth() - dob.getMonth();
      let days = today.getDate() - dob.getDate();

      if (days < 0) {
        months -= 1;
        const previousMonthLastDay = new Date(today.getFullYear(), today.getMonth(), 0).getDate();
        days += previousMonthLastDay;
      }

      if (months < 0) {
        years -= 1;
        months += 12;
      }

      const diffMs = today - dob;
      const totalDays = Math.floor(diffMs / 86400000);
      const totalHours = Math.floor(diffMs / 3600000);

      let nextBirthday = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
      if (nextBirthday < new Date(today.getFullYear(), today.getMonth(), today.getDate())) {
        nextBirthday = new Date(today.getFullYear() + 1, dob.getMonth(), dob.getDate());
      }
      const daysToBirthday = Math.ceil((nextBirthday - today) / 86400000);

      setResult("result", `
        <div class="result-list">
          <div>Exact age: ${years} years, ${months} months, ${days} days</div>
          <div>Total days lived: ${formatNumber(totalDays, 0)}</div>
          <div>Total hours lived: ${formatNumber(totalHours, 0)}</div>
          <div>Next birthday: ${daysToBirthday === 0 ? "Today" : `${daysToBirthday} day(s) left`}</div>
        </div>
      `);
    }

    function clearAge() {
      document.getElementById("dob").value = "";
      setResult("result", "Select your date of birth to see your age.", "");
    }
  </script>
