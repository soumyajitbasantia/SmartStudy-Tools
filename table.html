    <div class="container">
      <a class="btn btn-secondary" href="tool.html"><span class="icon-only" aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></span> Back to tools</a>
      <section class="calculator panel" aria-labelledby="pageTitle">
        <span class="eyebrow">Practice</span>
        <h1 id="pageTitle">Multiplication Table Generator</h1>
        <p class="muted">Generate tables up to any range and use them for quick revision.</p>

        <div class="form-grid">
          <div class="two-column">
            <div class="field">
              <label for="tableInput">Number</label>
              <input class="input" type="number" id="tableInput" placeholder="Example: 12" step="1">
            </div>
            <div class="field">
              <label for="tableLimit">Up to</label>
              <input class="input" type="number" id="tableLimit" value="10" min="1" max="100" step="1">
            </div>
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="button" onclick="generateTable()">Generate table</button>
            <button class="btn btn-secondary" type="button" onclick="clearTable()">Clear</button>
            <button class="btn btn-secondary" type="button" onclick="copyResult('tableResult')">Copy result</button>
          </div>
        </div>

        <div class="result-box" id="tableResult" aria-live="polite">Enter a number to generate its table.</div>
      </section>
    </div>
  </main>

  <script src="assets/js/app.js?v=4"></script>
  <script>
    function generateTable() {
      const num = getNumber("tableInput");
      const limit = Math.trunc(getNumber("tableLimit"));

      if (!Number.isFinite(num) || !Number.isInteger(limit) || limit < 1 || limit > 100) {
        setResult("tableResult", "Please enter a valid number and a range between 1 and 100.", "error");
        return;
      }

      let tableHTML = '<div class="result-list">';
      for (let i = 1; i <= limit; i++) {
        tableHTML += `<div>${formatNumber(num, 4)} × ${i} = ${formatNumber(num * i, 4)}</div>`;
      }
      tableHTML += "</div>";
      setResult("tableResult", tableHTML);
    }

    function clearTable() {
      document.getElementById("tableInput").value = "";
      document.getElementById("tableLimit").value = "10";
      setResult("tableResult", "Enter a number to generate its table.", "");
    }
  </script>
