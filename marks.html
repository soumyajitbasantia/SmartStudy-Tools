<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Calculate marks percentage and grade using SmartStudy Tools."><meta name="theme-color" content="#2563eb"><title>Marks Percentage Calculator - SmartStudy Tools</title><link rel="icon" href="assets/images/icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/css/styles.css?v=4"></head>
<body><header class="site-header"><nav class="navbar" aria-label="Main navigation"><a class="logo" href="index.html"><span class="logo-mark" aria-hidden="true">S</span><span>SmartStudy Tools</span></a><div class="nav-links"><a href="index.html">Home</a><a href="tool.html">Tools</a></div></nav></header>
<main class="tool-page"><div class="container"><a class="btn btn-secondary" href="tool.html"><span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></span> Back to tools</a><section class="calculator panel" aria-labelledby="pageTitle"><span class="eyebrow">Calculator</span><h1 id="pageTitle">Marks Percentage Calculator</h1><p class="muted">Find total marks, percentage, and a simple grade category.</p><div class="two-column"><div class="field"><label for="obtained">Marks obtained</label><input class="input" id="obtained" type="number" min="0" step="any" placeholder="Example: 420"></div><div class="field"><label for="maximum">Maximum marks</label><input class="input" id="maximum" type="number" min="1" step="any" placeholder="Example: 500"></div></div><div class="actions"><button class="btn btn-primary" onclick="calculateMarks()">Calculate</button><button class="btn btn-secondary" onclick="copyResult('marksResult')">Copy result</button><button class="btn btn-secondary" onclick="clearMarks()">Clear</button></div><div class="result-box" id="marksResult" aria-live="polite">Enter marks to calculate percentage.</div></section></div></main>
<script src="assets/js/app.js?v=4"></script><script>
function grade(p){return p>=90?'A+ Excellent':p>=80?'A Very good':p>=70?'B Good':p>=60?'C Average':p>=50?'D Pass':'Needs improvement'}
function calculateMarks(){const o=getNumber('obtained'), m=getNumber('maximum'); if(!Number.isFinite(o)||!isPositiveNumber(m)||o<0||o>m){setResult('marksResult','Enter valid marks. Obtained marks cannot be more than maximum marks.','error');return;} const p=o/m*100; setResult('marksResult',`Percentage: ${formatNumber(p,2)}%<br>Grade: ${grade(p)}<br>Marks: ${formatNumber(o,2)} / ${formatNumber(m,2)}`)}
function clearMarks(){obtained.value='';maximum.value='';setResult('marksResult','Enter marks to calculate percentage.','')}
</script></body></html>
