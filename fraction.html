<body><header class="site-header"><nav class="navbar" aria-label="Main navigation"><a class="logo" href="index.html"><span class="logo-mark" aria-hidden="true">S</span><span>SmartStudy Tools</span></a><div class="nav-links"><a href="index.html">Home</a><a href="tool.html">Tools</a>

<main class="tool-page"><div class="container"><a class="btn btn-secondary" href="tool.html"><span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></span> Back to tools</a><section class="calculator panel" aria-labelledby="pageTitle"><span class="eyebrow">Calculator</span><h1 id="pageTitle">Fraction Calculator</h1><p class="muted">Enter two fractions and choose an operation. Example: 1/2 and 3/4.</p><div class="two-column"><div class="field"><label for="f1">First fraction</label><input class="input" id="f1" placeholder="1/2"></div><div class="field"><label for="f2">Second fraction</label><input class="input" id="f2" placeholder="3/4"></div></div><div class="field"><label for="op">Operation</label><select class="select" id="op"><option value="+">Add</option><option value="-">Subtract</option><option value="*">Multiply</option><option value="/">Divide</option></select></div><div class="actions"><button class="btn btn-primary" onclick="calculateFraction()">Calculate</button><button class="btn btn-secondary" onclick="copyResult('fractionResult')">Copy result</button><button class="btn btn-secondary" onclick="clearFraction()">Clear</button></div><div class="result-box" id="fractionResult" aria-live="polite">Enter fractions to calculate.</div></section></div></main>
<script src="assets/js/app.js?v=4"></script><script>
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}
function parseFraction(v){const parts=v.trim().split('/').map(Number); if(parts.length===1&&Number.isFinite(parts[0])) return [parts[0],1]; if(parts.length!==2||!Number.isFinite(parts[0])||!Number.isFinite(parts[1])||parts[1]===0) return null; return parts}
function simplify(n,d){if(d<0){n=-n;d=-d} const g=gcd(n,d); return [n/g,d/g]}
function calculateFraction(){const a=parseFraction(f1.value), b=parseFraction(f2.value); if(!a||!b){setResult('fractionResult','Please enter valid fractions like 1/2 or whole numbers like 5.','error');return;} let n,d; if(op.value==='+'){n=a[0]*b[1]+b[0]*a[1];d=a[1]*b[1]} if(op.value==='-'){n=a[0]*b[1]-b[0]*a[1];d=a[1]*b[1]} if(op.value==='*'){n=a[0]*b[0];d=a[1]*b[1]} if(op.value==='/'){if(b[0]===0){setResult('fractionResult','Cannot divide by zero.','error');return;} n=a[0]*b[1];d=a[1]*b[0]} const [sn,sd]=simplify(n,d); const decimal=sn/sd; setResult('fractionResult',`Result: ${sn}/${sd}<br>Decimal: ${formatNumber(decimal,6)}`)}
function clearFraction(){f1.value='';f2.value='';setResult('fractionResult','Enter fractions to calculate.','')}
</script></body></html>
